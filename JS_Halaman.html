<script>
    function renderAset() {
      const asetLancar = state.accounts.filter(a => a.type !== 'Kredit');
      const kartuKredit = state.accounts.filter(a => a.type === 'Kredit');
      
      const totalLancar = asetLancar.reduce((sum, a) => sum + accountBalance(a.name), 0);
      const totalInvestasi = state.investasi.reduce((sum, inv) => sum + Number(inv.currentValue || 0), 0);
      const totalKredit = kartuKredit.reduce((sum, a) => sum + accountBalance(a.name), 0);
      const grandTotal = totalLancar + totalInvestasi - totalKredit;

      const asetLancarCards = asetLancar.map((a,i) => { 
        const m = accMeta(a.name, i, a.type); 
        const bal = accountBalance(a.name); 
        return `
          <div class="card" style="padding:15.3px 13.6px; width:123.2px; flex-shrink:0; display:flex; flex-direction:column; border-top: 3.4px solid ${m.color}">
             <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8.5px;margin-bottom:13.6px">
                ${accIcon(a.name, i, a.type, 38)}
                <div style="font-size:11.9px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%">${escapeHtml(a.name)}</div>
             </div>
             <div style="font-size:9.3px;color:var(--text-muted);font-weight:700;margin-bottom:3.4px">SALDO</div>
             <div class="tabular" style="font-size:13.6px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%">${fmtHide(bal)}</div>
          </div>`; 
      }).join('');

      const kartuKreditCards = kartuKredit.map((a,i) => { 
        const m = accMeta(a.name, i, a.type); 
        const tagihan = accountBalance(a.name);
        const limit = Number(a.limit || 0);
        const sisa = limit - tagihan;
        const pct = limit > 0 ? Math.min((tagihan / limit) * 100, 100) : (tagihan > 0 ? 100 : 0);
        
        return `
          <div class="card" onclick="openCCDetail('${escapeHtml(a.name)}')" style="padding:17px; width:255px; flex-shrink:0; cursor:pointer; display:flex; flex-direction:column; border-top: 3.4px solid ${m.color}">
            <div style="display:flex;align-items:center;gap:10.2px;margin-bottom:13.6px">
              ${accIcon(a.name, i, a.type, 42)}
              <div style="flex:1;min-width:0">
                <div style="font-size:12.8px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(a.name)}</div>
              </div>
            </div>
            <div style="height:6.8px;border-radius:999px;background:var(--surface-raised);overflow:hidden;margin-bottom:10.2px">
               <div style="width:${pct}%;height:100%;background:${pct > 80 ? 'var(--coral)' : 'var(--violet)'};border-radius:999px"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;">
               <div>
                  <div style="font-size:9.3px;color:var(--text-muted);font-weight:700;margin-bottom:2px">TAGIHAN</div>
                  <div class="tabular" style="font-size:13.6px;font-weight:800;color:var(--coral)">${fmtHide(tagihan)}</div>
               </div>
               <div style="text-align:right">
                  <div style="font-size:9.3px;color:var(--text-muted);font-weight:700;margin-bottom:2px">SISA LIMIT</div>
                  <div class="tabular" style="font-size:13.6px;font-weight:800;color:var(--emerald)">${limit > 0 ? fmtHide(sisa) : '-'}</div>
               </div>
            </div>
          </div>`; 
      }).join('');
      
      return `
        ${screenHeader('Aset & Portofolio', true)}
        <div style="border-radius:23.8px;padding:22.1px;margin-bottom:18.7px;background:var(--hero-gradient);box-shadow:0 13.6px 25.5px -11.9px rgba(20,39,78,0.5)">
          <div style="color:rgba(255,255,255,0.85);font-size:11.9px;font-weight:700;letter-spacing:0.5px">TOTAL KEKAYAAN BERSIH</div>
          <div class="display tabular" style="color:white;font-size:32.3px;font-weight:800;margin-top:6.8px;margin-bottom:17px">${fmtHide(grandTotal)}</div>
          <div style="display:flex;gap:11.9px;border-top:1px solid rgba(255,255,255,0.25);padding-top:11.9px">
            <div style="flex:1">
              <div style="color:rgba(255,255,255,0.8);font-size:10.2px;font-weight:700">ASET LANCAR</div>
              <div class="tabular" style="color:white;font-size:15.3px;font-weight:800">${fmtHide(totalLancar)}</div>
            </div>
            <div style="flex:1">
              <div style="color:rgba(255,255,255,0.8);font-size:10.2px;font-weight:700">INVESTASI</div>
              <div class="tabular" style="color:white;font-size:15.3px;font-weight:800">${fmtHide(totalInvestasi)}</div>
            </div>
          </div>
        </div>
        
        <div style="font-size:13.6px;font-weight:800;color:var(--text);margin:20.4px 0 10.2px;display:flex;justify-content:space-between;align-items:center">
           <span>Aset Lancar</span>
           <span class="tabular" style="font-size:11px;color:var(--text-muted);font-weight:600">${fmtHide(totalLancar)}</span>
        </div>
        <div class="horizontal-scroll" style="margin-bottom:20.4px;">
          ${asetLancarCards}
        </div>

        ${kartuKredit.length > 0 ? `
        <div style="font-size:13.6px;font-weight:800;color:var(--text);margin:20.4px 0 10.2px;display:flex;justify-content:space-between;align-items:center">
           <span>Kartu Kredit & Paylater</span>
           <span class="tabular" style="font-size:11px;color:var(--text-muted);font-weight:600">${fmtHide(totalKredit)}</span>
        </div>
        <div class="horizontal-scroll" style="margin-bottom:20.4px;">
          ${kartuKreditCards}
        </div>
        ` : ''}

        <div style="font-size:13.6px;font-weight:800;color:var(--text);margin:20.4px 0 10.2px;display:flex;justify-content:space-between;align-items:center">
           <span>Investasi</span>
           <span class="tabular" style="font-size:11px;color:var(--text-muted);font-weight:600">${fmtHide(totalInvestasi)}</span>
        </div>
        <div class="horizontal-scroll" style="margin-bottom:20.4px;">
          ${state.investasi.length === 0 ? '<div class="card" style="padding:20.4px;text-align:center;color:var(--text-muted);font-size:12.3px;font-weight:500;width:100%">Belum ada investasi.</div>' : state.investasi.map(renderInvestasiCard).join('')}
        </div>
        <button class="btn-primary" onclick="openInvestasiBaruModal()" style="margin-bottom:27.2px; background:var(--surface-raised); color:var(--violet); box-shadow:none;"><i data-lucide="plus" style="width:17px;height:17px"></i> Tambah Investasi Baru</button>
      `;
    }

    function renderInvestasiCard(inv) {
      const modal = Number(inv.modal || 0);
      const value = Number(inv.currentValue || 0);
      const gain = value - modal;
      const gainPct = modal ? (gain / modal) * 100 : 0;
      const up = gain >= 0;
      return `<div class="card" style="padding:17px;width:280.5px;flex-shrink:0;box-sizing:border-box;border-top: 3.4px solid #00C896">
        <div style="display:flex;align-items:center;gap:11.9px;margin-bottom:10.2px">
          ${invIcon(inv, 46)}
          <div style="flex:1;min-width:0">
            <div style="font-size:13.6px;font-weight:700;color:var(--text)">${escapeHtml(inv.name)}</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:500">${escapeHtml(inv.type)}</div>
          </div>
          <button onclick="removeInvestasi('${inv.id}')" style="background:none;border:none;cursor:pointer;padding:5.1px;color:var(--text-muted)"><i data-lucide="trash-2" style="width:15.3px;height:15.3px"></i></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:11.9px">
          <div>
            <div style="font-size:10.2px;color:var(--text-muted);font-weight:600">NILAI SEKARANG</div>
            <div class="tabular" style="font-size:18.7px;font-weight:800;color:var(--text)">${fmtHide(value)}</div>
          </div>
          <div style="text-align:right">
            <div class="tabular" style="font-size:11.9px;font-weight:800;color:${up?'var(--emerald)':'var(--coral)'}">${up?'+':''}${fmtHide(gain)}</div>
            <div style="font-size:10.2px;font-weight:700;color:${up?'var(--emerald)':'var(--coral)'}">${up?'+':''}${gainPct.toFixed(1)}%</div>
          </div>
        </div>
        <div class="tabular" style="font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:11.9px">Modal: ${fmtHide(modal)}</div>
        <div style="display:flex;gap:8.5px">
          <button onclick="openInvestasiSetor('${inv.id}')" style="flex:1;background:var(--violet-soft);border:none;border-radius:10.2px;padding:9.3px 0;color:var(--violet);font-size:11.5px;font-weight:700;cursor:pointer">+ Setor</button>
          <button onclick="openInvestasiUpdateValue('${inv.id}')" style="flex:1;background:var(--surface-raised);border:none;border-radius:10.2px;padding:9.3px 0;color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer">Update Nilai</button>
          <button onclick="openInvestasiJual('${inv.id}')" style="flex:1;background:var(--surface-raised);border:none;border-radius:10.2px;padding:9.3px 0;color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer">Jual</button>
        </div>
      </div>`;
    }

    function openInvestasiBaruModal() {
      window._investasiName = '';
      window._investasiModalRaw = '';
      window._investasiJenis = INVESTASI_JENIS[0];
      window._investasiAccount = state.accounts.filter(a => a.type !== 'Kredit')[0]?.name || 'Tunai';
      renderInvestasiBaruModal();
    }

    function renderInvestasiBaruModal() {
      const jenisChips = INVESTASI_JENIS.map(j => `<button class="chip ${(window._investasiJenis||INVESTASI_JENIS[0])===j?'active':''}" onclick="window._investasiJenis='${j}';renderInvestasiBaruModal()">${j}</button>`).join('');
      const accountChips = state.accounts.filter(a => a.type !== 'Kredit').map(a => `<button class="chip ${(window._investasiAccount||state.accounts[0].name)===a.name?'active':''}" onclick="window._investasiAccount='${escapeHtml(a.name)}';renderInvestasiBaruModal()">${escapeHtml(a.name)}</button>`).join('');
      
      openOverlay(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13.6px">
          <span class="display" style="font-weight:800;font-size:20.4px;color:var(--text)">Investasi Baru</span>
          <button onclick="closeModal()" style="background:var(--surface-raised);border:none;border-radius:11.9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer"><i data-lucide="x" style="width:17px;height:17px;color:var(--text-muted)"></i></button>
        </div>
        
        <label class="field-label" for="investasi-name" style="margin-top:8.5px">Nama investasi</label>
        <input id="investasi-name" oninput="window._investasiName=this.value" value="${escapeHtml(window._investasiName||'')}" class="field-input" placeholder="Misal: Reksadana BCA">
        
        <label class="field-label">Jenis</label>
        <div style="display:flex;gap:8.5px;overflow-x:auto;padding-bottom:5.1px;margin-bottom:6.8px">
          ${jenisChips}
        </div>
        
        <label class="field-label" for="investasi-modal">Modal awal (opsional, Rp)</label>
        <input id="investasi-modal" class="field-input" oninput="formatNumberInput(this); window._investasiModalRaw=this.value" value="${window._investasiModalRaw || ''}" placeholder="0" inputmode="numeric">
        
        <label class="field-label">Dari akun (kalau isi modal awal)</label>
        <div style="display:flex;gap:8.5px;flex-wrap:wrap;padding-bottom:5.1px">
          ${accountChips}
        </div>
        
        <div id="investasi-error" class="err"></div>
        <button class="btn-primary" onclick="submitInvestasiBaru()"><i data-lucide="plus" style="width:17px;height:17px"></i> Tambah Investasi</button>
      `);
    }

    function submitInvestasiBaru() {
      const name = document.getElementById('investasi-name').value.trim();
      const modal = parseFloat((document.getElementById('investasi-modal').value || '0').replace(/[^0-9]/g,'')) || 0;
      const errEl = document.getElementById('investasi-error');
      if (!name) { errEl.textContent = 'Masukkan nama investasi'; return; }
      errEl.textContent = '';
      const item = {
        id: 'temp-' + Date.now(), name: name, type: window._investasiJenis || INVESTASI_JENIS[0], initialAmount: modal,
        account: window._investasiAccount || (state.accounts[0] && state.accounts[0].name),
        date: new Date().toISOString().slice(0,10), modal: modal, currentValue: modal
      };
      state.investasi.push(item);
      if (modal > 0) {
          state.transactions.unshift({
             id: 'temp-tx-' + Date.now(), date: item.date, desc: 'Beli investasi: ' + item.name,
             category: 'Investasi', type: 'Keluar', amount: modal, account: item.account
          });
      }
      window._investasiName = ''; window._investasiModalRaw = '';
      closeModal();
      render();
      google.script.run.withSuccessHandler(() => { loadData(); showToast('Investasi ditambahkan!'); }).withFailureHandler(onError).addInvestasi(item);
    }
    
    function removeInvestasi(id) { google.script.run.withSuccessHandler(() => { loadData(); showToast('Terhapus!'); }).withFailureHandler(onError).deleteInvestasi(id); }

    function openInvestasiSetor(id) {
      window._investasiActionId = id; window._investasiActionAccount = (state.accounts[0] && state.accounts[0].name) || 'Tunai'; window._investasiActionAmountRaw = '';
      renderInvestasiSetorModal();
    }
    function renderInvestasiSetorModal() {
      const id = window._investasiActionId;
      const inv = state.investasi.find(i => i.id === id);
      const accountChips = state.accounts.filter(a => a.type !== 'Kredit').map(a => `<button class="chip ${window._investasiActionAccount===a.name?'active':''}" onclick="window._investasiActionAccount='${escapeHtml(a.name)}';renderInvestasiSetorModal()">${escapeHtml(a.name)}</button>`).join('');
      openOverlay(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13.6px">
          <span class="display" style="font-weight:800;font-size:20.4px;color:var(--text)">Setor ke ${escapeHtml(inv.name)}</span>
          <button onclick="closeModal()" style="background:var(--surface-raised);border:none;border-radius:11.9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer"><i data-lucide="x" style="width:17px;height:17px;color:var(--text-muted)"></i></button>
        </div>
        <div class="card" style="padding:17px;margin-bottom:17px">
          <label for="investasi-setor-amount" style="color:var(--text-muted);font-size:11px;margin-bottom:5.1px;font-weight:700;display:block">NOMINAL (RP)</label>
          <input id="investasi-setor-amount" oninput="formatNumberInput(this); window._investasiActionAmountRaw=this.value" value="${window._investasiActionAmountRaw || ''}" placeholder="0" inputmode="numeric" style="width:100%;background:none;border:none;outline:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32.3px;color:var(--violet)">
        </div>
        <label class="field-label" style="margin-top:0">Dari akun</label><div style="display:flex;gap:8.5px;flex-wrap:wrap;padding-bottom:5.1px">${accountChips}</div>
        <div id="investasi-setor-error" class="err"></div><button class="btn-primary" onclick="submitInvestasiSetor()"><i data-lucide="check" style="width:17px;height:17px"></i> Simpan setoran</button>
      `);
    }
    function submitInvestasiSetor() {
      const amount = parseFloat(document.getElementById('investasi-setor-amount').value.replace(/[^0-9]/g,''));
      if (!amount || amount <= 0) return;
      const inv = state.investasi.find(i => i.id === window._investasiActionId);
      if (inv) { inv.modal = Number(inv.modal||0) + amount; inv.currentValue = Number(inv.currentValue||0) + amount; }
      state.transactions.unshift({
         id: 'temp-' + Date.now(), date: new Date().toISOString().slice(0,10), desc: 'Setor investasi: ' + inv.name,
         category: 'Investasi', type: 'Keluar', amount: amount, account: window._investasiActionAccount
      });
      closeModal(); render();
      google.script.run.withSuccessHandler(() => { loadData(); showToast('Setoran tersimpan!'); }).withFailureHandler(onError).addInvestasiSetoran(window._investasiActionId, amount, window._investasiActionAccount, new Date().toISOString().slice(0,10));
    }
    
    function openInvestasiUpdateValue(id) {
      const inv = state.investasi.find(i => i.id === id); window._investasiActionId = id; window._investasiUpdateValueRaw = inv.currentValue ? inv.currentValue.toLocaleString('id-ID').replace(/,/g, '.') : '';
      renderInvestasiUpdateValueModal();
    }
    function renderInvestasiUpdateValueModal() {
      const inv = state.investasi.find(i => i.id === window._investasiActionId);
      openOverlay(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13.6px"><span class="display" style="font-weight:800;font-size:20.4px;color:var(--text)">Update nilai ${escapeHtml(inv.name)}</span><button onclick="closeModal()" style="background:var(--surface-raised);border:none;border-radius:11.9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer"><i data-lucide="x" style="width:17px;height:17px;color:var(--text-muted)"></i></button></div>
        <div style="font-size:11.9px;color:var(--text-muted);margin-bottom:13.6px;font-weight:500">Nilai pasar saat ini. Tidak membuat transaksi — cuma menghitung ulang untung/rugi.</div>
        <div class="card" style="padding:17px;margin-bottom:17px">
          <label for="investasi-value-amount" style="color:var(--text-muted);font-size:11px;margin-bottom:5.1px;font-weight:700;display:block">NILAI SEKARANG (RP)</label>
          <input id="investasi-value-amount" oninput="formatNumberInput(this); window._investasiUpdateValueRaw=this.value" placeholder="0" value="${window._investasiUpdateValueRaw || ''}" inputmode="numeric" style="width:100%;background:none;border:none;outline:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32.3px;color:var(--violet)">
        </div>
        <div id="investasi-value-error" class="err"></div><button class="btn-primary" onclick="submitInvestasiUpdateValue()"><i data-lucide="check" style="width:17px;height:17px"></i> Simpan</button>
      `);
    }
    function submitInvestasiUpdateValue() {
      const value = parseFloat(document.getElementById('investasi-value-amount').value.replace(/[^0-9]/g,''));
      if (value === null || isNaN(value) || value < 0) return;
      const inv = state.investasi.find(i => i.id === window._investasiActionId);
      if (inv) inv.currentValue = value;
      closeModal(); render();
      google.script.run.withSuccessHandler(() => { loadData(); showToast('Nilai diperbarui!'); }).withFailureHandler(onError).updateInvestasiValue(window._investasiActionId, value);
    }
    
    function openInvestasiJual(id) {
      window._investasiActionId = id; window._investasiActionAccount = (state.accounts[0] && state.accounts[0].name) || 'Tunai'; window._investasiSellAmountRaw = '';
      renderInvestasiJualModal();
    }
    function renderInvestasiJualModal() {
      const inv = state.investasi.find(i => i.id === window._investasiActionId);
      const accountChips = state.accounts.filter(a => a.type !== 'Kredit').map(a => `<button class="chip ${window._investasiActionAccount===a.name?'active':''}" onclick="window._investasiActionAccount='${escapeHtml(a.name)}';renderInvestasiJualModal()">${escapeHtml(a.name)}</button>`).join('');
      openOverlay(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6.8px"><span class="display" style="font-weight:800;font-size:20.4px;color:var(--text)">Jual ${escapeHtml(inv.name)}</span><button onclick="closeModal()" style="background:var(--surface-raised);border:none;border-radius:11.9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer"><i data-lucide="x" style="width:17px;height:17px;color:var(--text-muted)"></i></button></div>
        <div style="font-size:11.9px;color:var(--text-muted);margin-bottom:13.6px;font-weight:500">Nilai saat ini: ${fmtRp(inv.currentValue)}</div>
        <div class="card" style="padding:17px;margin-bottom:17px">
          <label for="investasi-jual-amount" style="color:var(--text-muted);font-size:11px;margin-bottom:5.1px;font-weight:700;display:block">NOMINAL DIJUAL (RP)</label>
          <input id="investasi-jual-amount" oninput="formatNumberInput(this); window._investasiSellAmountRaw=this.value" value="${window._investasiSellAmountRaw||''}" placeholder="0" inputmode="numeric" style="width:100%;background:none;border:none;outline:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32.3px;color:var(--coral)">
        </div>
        <label class="field-label" style="margin-top:0">Masuk ke akun</label><div style="display:flex;gap:8.5px;flex-wrap:wrap;padding-bottom:5.1px">${accountChips}</div>
        <div id="investasi-jual-error" class="err"></div><button class="btn-primary" onclick="submitInvestasiJual()"><i data-lucide="check" style="width:17px;height:17px"></i> Simpan penjualan</button>
      `);
    }
    function submitInvestasiJual() {
      const amount = parseFloat(document.getElementById('investasi-jual-amount').value.replace(/[^0-9]/g,''));
      if (!amount || amount <= 0) return;
      const inv = state.investasi.find(i => i.id === window._investasiActionId);
      if (inv) {
          inv.modal = Math.max(0, Number(inv.modal||0) - amount); 
          inv.currentValue = Math.max(0, Number(inv.currentValue||0) - amount);
      }
      state.transactions.unshift({
         id: 'temp-' + Date.now(), date: new Date().toISOString().slice(0,10), desc: 'Pencairan investasi: ' + inv.name,
         category: 'Investasi', type: 'Masuk', amount: amount, account: window._investasiActionAccount
      });
      closeModal(); render();
      google.script.run.withSuccessHandler(res => { if(res && res.success){ loadData(); showToast('Tersimpan!'); } else onError(res); }).withFailureHandler(onError).sellInvestasi(window._investasiActionId, amount, window._investasiActionAccount, new Date().toISOString().slice(0,10));
    }

    function openCCDetail(name) {
      const acc = state.accounts.find(a => a.name === name);
      if (!acc) return;
      const tagihan = accountBalance(name);
      const limit = Number(acc.limit || 0);
      const sisa = limit - tagihan;
      const pct = limit > 0 ? Math.min((tagihan / limit) * 100, 100) : (tagihan > 0 ? 100 : 0);

      const ccTx = state.transactions
         .filter(t => t.account === name)
         .sort((a,b) => a.date < b.date ? 1 : -1);
         
      const now = new Date();
      let cycleStart, cycleEnd;
      if (now.getDate() <= 15) {
          cycleStart = new Date(now.getFullYear(), now.getMonth() - 1, 16);
          cycleEnd = new Date(now.getFullYear(), now.getMonth(), 15);
      } else {
          cycleStart = new Date(now.getFullYear(), now.getMonth(), 16);
          cycleEnd = new Date(now.getFullYear(), now.getMonth() + 1, 15);
      }
      
      let tagihanBerjalan = 0;
      ccTx.forEach(t => {
          const d = new Date(t.date + 'T00:00:00');
          if (d >= cycleStart && d <= cycleEnd) {
              if (t.desc.startsWith('Limit CC Terpakai:') || t.desc.startsWith('Pembelian Cicilan:') || t.desc.startsWith('Pemulihan Pokok:') || t.desc.startsWith('Pemulihan Limit CC: Cicilan')) return;
              if (t.type === 'Keluar') tagihanBerjalan += Number(t.amount);
              else if (t.type === 'Masuk' && t.category !== 'Pembayaran CC') tagihanBerjalan -= Number(t.amount);
          }
      });

      const ccCicilan = state.cicilan.filter(c => c.ccAccount === name && c.status !== 'Lunas');
      const totalCicilanAkanDatang = ccCicilan.reduce((sum, c) => sum + Number(c.amountPerInstallment), 0);
      
      const formatDateShort = (d) => d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
      const cycleLabel = `${formatDateShort(cycleStart)} - ${formatDateShort(cycleEnd)}`;

      let txHtml = '';
      if (ccTx.length === 0) {
         txHtml = `<div style="text-align:center;color:var(--text-muted);font-size:11.9px;padding:20.4px 0;font-weight:500">Belum ada transaksi.</div>`;
      } else {
         txHtml = ccTx.map((t, i) => {
            const meta = catMeta(t.category);
            const isKeluar = t.type === 'Keluar'; 
            
            const formattedAmt = parseInt(t.amount || 0, 10).toLocaleString('id-ID').replace(/,/g, '.');
            const paySpecificBtn = isKeluar ? `<button onclick="closeModal(); setTimeout(() => { openTransferModal(); window._transferMode='akun'; window._transferTo='${escapeHtml(name)}'; window._transferAmountRaw='${formattedAmt}'; window._transferNotes='Bayar: ${escapeHtml(t.desc)}'; renderTransferModal(); }, 300)" style="background:var(--violet-soft);color:var(--violet);border:none;border-radius:8.5px;padding:6.8px 11.9px;font-size:11px;font-weight:700;cursor:pointer;margin-top:8.5px;display:inline-flex;align-items:center;gap:6.8px;box-shadow:0 2px 5.1px rgba(27,47,94,0.15)"><i data-lucide="check-circle-2" style="width:13.6px;height:13.6px;"></i> Bayar Tagihan Ini</button>` : '';

            return `
            <div style="display:flex;align-items:flex-start;padding:11.9px 0;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
              <div onclick="showTxDetail('${t.id}')" style="cursor:pointer;margin-top:2px;">
                  ${iconBubble(meta.icon, meta.color, 42)}
              </div>
              <div style="flex:1;min-width:0;margin-left:11.9px;">
                <div onclick="showTxDetail('${t.id}')" style="cursor:pointer;">
                  <div style="font-size:12.8px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(t.desc)}</div>
                  <div style="font-size:11px;color:var(--text-muted);font-weight:500">${fmtDateLabel(t.date)}</div>
                </div>
                ${paySpecificBtn}
              </div>
              <div class="tabular" style="font-size:13.2px;font-weight:800;color:${isKeluar?'var(--text)':'var(--emerald)'};flex-shrink:0;cursor:pointer" onclick="showTxDetail('${t.id}')">
                ${isKeluar ? '' : '-'}${fmtRp(t.amount)}
              </div>
            </div>`;
         }).join('');
      }

      const actionHtml = `
        <div style="display:flex;gap:8.5px;margin-top:20.4px;">
          <button onclick="closeModal(); state.tab='report'; state.txAccount='${escapeHtml(name)}'; render(); window.scrollTo(0,0);" style="flex:1;background:var(--surface-raised);border:none;border-radius:11.9px;padding:11.9px 0;color:var(--text);font-size:12.8px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6.8px">
            <i data-lucide="list" style="width:15.3px;height:15.3px"></i> Filter Report
          </button>
          <button onclick="closeModal(); setTimeout(() => { openTransferModal(); window._transferMode='akun'; window._transferTo='${escapeHtml(name)}'; renderTransferModal(); }, 300)" style="flex:1;background:var(--violet-soft);border:none;border-radius:11.9px;padding:11.9px 0;color:var(--violet);font-size:12.8px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6.8px">
            <i data-lucide="credit-card" style="width:15.3px;height:15.3px"></i> Bayar
          </button>
        </div>
      `;

      openOverlay(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px">
          <span class="display" style="font-weight:800;font-size:20.4px;color:var(--text)">Detail Kartu Kredit</span>
          <button onclick="closeModal()" style="background:var(--surface-raised);border:none;border-radius:11.9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer"><i data-lucide="x" style="width:17px;height:17px;color:var(--text-muted)"></i></button>
        </div>
        <div class="card" style="padding:20.4px;margin-bottom:17px;">
           ${cardBanner(name)}
           <div style="font-size:15.3px;font-weight:800;color:var(--text);margin-bottom:13.6px;text-align:center;">${escapeHtml(name)}</div>

           <div style="padding:13.6px; background:var(--surface-raised); border-radius:13.6px; margin-bottom:17px">
              <div style="font-size:9.8px; font-weight:800; color:var(--text-muted); margin-bottom:10.2px; letter-spacing:0.5px">SIKLUS BERJALAN (${cycleLabel})</div>
              
              <div style="display:flex;justify-content:space-between;margin-bottom:6.8px">
                 <span style="font-size:11px;color:var(--text);font-weight:600">Pemakaian Berjalan</span>
                 <span class="tabular" style="font-size:11.9px;font-weight:800;color:var(--text)">${fmtHide(tagihanBerjalan)}</span>
              </div>
              
              ${ccCicilan.length > 0 ? `
              <div style="display:flex;justify-content:space-between;margin-bottom:10.2px">
                 <span style="font-size:11px;color:var(--text);font-weight:600">Cicilan Akan Ditagih (${ccCicilan.length} item)</span>
                 <span class="tabular" style="font-size:11.9px;font-weight:800;color:var(--text)">${fmtHide(totalCicilanAkanDatang)}</span>
              </div>
              ` : ''}

              <div style="display:flex;justify-content:space-between;padding-top:10.2px;border-top:1px dashed var(--border)">
                 <span style="font-size:11px;color:var(--violet);font-weight:800">Est. Tagihan Cetak</span>
                 <span class="tabular" style="font-size:12.8px;font-weight:800;color:var(--violet)">${fmtHide(Math.max(0, tagihanBerjalan + totalCicilanAkanDatang))}</span>
              </div>
           </div>

           <div style="height:8.5px;border-radius:999px;background:var(--surface-raised);overflow:hidden;margin-bottom:13.6px">
              <div style="width:${pct}%;height:100%;background:${pct > 80 ? 'var(--coral)' : 'var(--violet)'};border-radius:999px"></div>
           </div>
           <div style="display:flex;justify-content:space-between;margin-bottom:8.5px">
              <span style="font-size:11.9px;color:var(--text-muted);font-weight:600">Total Outstanding</span>
              <span class="tabular" style="font-size:12.8px;font-weight:800;color:var(--coral)">${fmtHide(tagihan)}</span>
           </div>
           <div style="display:flex;justify-content:space-between;margin-bottom:8.5px">
              <span style="font-size:11.9px;color:var(--text-muted);font-weight:600">Limit Kartu</span>
              <span class="tabular" style="font-size:12.8px;font-weight:800;color:var(--text)">${fmtHide(limit)}</span>
           </div>
           <div style="display:flex;justify-content:space-between;padding-top:8.5px;border-top:1px dashed var(--border)">
              <span style="font-size:11.9px;color:var(--text-muted);font-weight:600">Sisa Limit</span>
              <span class="tabular" style="font-size:12.8px;font-weight:800;color:var(--emerald)">${limit > 0 ? fmtHide(sisa) : '-'}</span>
           </div>
           ${actionHtml}
        </div>
        
        <div style="font-size:13.6px;font-weight:800;color:var(--text);margin-bottom:10.2px;">Semua Transaksi</div>
        <div class="card" style="padding:5.1px 17px; max-height:340px; overflow-y:auto;">
            ${txHtml}
        </div>
      `);
    }

              <div style="font-size:12.8px;color:var(--text);font-weight:700">Kelola Akun & Limit Kredit</div>

          <div style="border-top:1px solid var(--border)"></div>
          <button onclick="setTab('pengaturan_budget')" style="width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:11.9px;padding:12.8px 0;text-align:left">

<span style="font-size:11.9px;color:var(--text-muted);font-weight:600">KAYA · Financial Tracker · v1.0.0 · Public Release · by Abidzi</span>

        <div style="margin-top:20.4px; font-size:13.6px; font-weight:800; color:var(--text);">Tambah Akun Baru</div>

            ${AKUN_TIPE.map(t => `<button class="chip ${(window._newAccType||'Aset')===t?'active':''}" onclick="window._newAccType='${t}';renderPengaturanAkun();document.getElementById('screen').innerHTML = renderPengaturanAkun();lucide.createIcons();">${t}</button>`).join('')}

        <div style="display:flex;flex-direction:column;gap:8.5px;margin-top:5.1px;margin-bottom:23.8px">
